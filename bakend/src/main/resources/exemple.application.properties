spring.application.name=erp

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/erp}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

erp.securite.secret=${JWT_SECRET:local-dev-secret-erp-bloc1-bloc2-32chars}
erp.securite.duree-validite=${JWT_DURATION:8h}
erp.securite.emetteur=${JWT_ISSUER:erp-tovo}

erp.validation.etapes=RH,FINANCE,DIRECTION
erp.validation.seuil-direction=0
erp.demande.delai-minimum=0d

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
server.port=8080
server.error.include-message=always
