spring.application.name=erp

# --- 1. Connexion a la base de donnees ---
spring.datasource.url=jdbc:postgresql://localhost:5432/erp
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# --- 2. JPA / Hibernate ---
# Le schema est gere par les migrations Flyway : Hibernate ne modifie que les donnees.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- 3. Migrations Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- 4. Securite ---
# Cle de signature des jetons : a remplacer par une valeur propre a chaque installation.
erp.securite.secret=changez-cette-cle-secrete-de-256-bits-minimum-dans-la-config
erp.securite.duree-validite=8h
erp.securite.emetteur=erp-tovo

# --- 5. Circuit de validation ---
# Etapes obligatoires du circuit, dans l'ordre. La direction est obligatoire
# au-dela du seuil ci-dessous (0 = toujours obligatoire).
erp.validation.etapes=RH,FINANCE,DIRECTION
erp.validation.seuil-direction=0

# --- 6. Planification des demandes ---
# Delai minimum entre la creation d'une demande et sa date souhaitee de recrutement.
erp.demande.delai-minimum=0d

# --- 7. Documentation de l'API ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- 8. Ports ---
server.port=8080
server.error.include-message=always
