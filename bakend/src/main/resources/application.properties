spring.application.name=erp

# PostgreSQL local/deployment configuration.
# Never commit real credentials; provide these values through the environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/erp}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns schema changes in deployed environments.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

# Hibernate validates the schema created by Flyway.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Donnees de demonstration du Bloc 3 (desactiver en production).
erp.demo.bloc3.enabled=${ERP_DEMO_BLOC3:true}

# JWT secret: provide JWT_SECRET in local/deployed environments.
erp.securite.secret=${JWT_SECRET:local-dev-secret-erp-bloc1-bloc2-32chars}
erp.securite.duree-validite=${JWT_DURATION:8h}
erp.securite.emetteur=${JWT_ISSUER:erp-tovo}

# Bloc 4 : parametres contractuels surchargeables par environnement.
erp.contrat.duree-max-cdd-mois=${CONTRAT_DUREE_MAX_CDD_MOIS:24}
erp.contrat.renouvellements-cdd-max=${CONTRAT_RENOUVELLEMENTS_CDD_MAX:1}
erp.contrat.onboarding-jours=${CONTRAT_ONBOARDING_JOURS:30}
erp.contrat.non-presentation-jours=${CONTRAT_NON_PRESENTATION_JOURS:3}
erp.contrat.signature-alerte-jours=${CONTRAT_SIGNATURE_ALERTE_JOURS:3}
erp.contrat.verification-echeances-ms=${CONTRAT_ECHEANCES_MS:3600000}
