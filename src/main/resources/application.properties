spring.application.name=erp
# --- 1. Connexion à la base de données ---
spring.datasource.url=jdbc:postgresql://localhost:5432/cinema
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# --- 2. Configuration JPA / Hibernate ---
# Définis la stratégie pour le schéma de la base de données (ex: update, create, validate)
spring.jpa.hibernate.ddl-auto=update

# Affiche ou masque les requêtes SQL dans la console (pratique pour le debug)
spring.jpa.show-sql=true

# Formate le SQL affiché pour qu'il soit plus lisible
spring.jpa.properties.hibernate.format_sql=true

# Indique le dialecte SQL (souvent détecté automatiquement, mais utile à préciser)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect